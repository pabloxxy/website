<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pablo de la Fuente - Contact</title>

    <link rel="canonical" href="https://pablodelafuente.xyz/Pablo/contact">
   
    <!-- Fonts -->
    <link rel="stylesheet" href="../fonts.css">
    <style>

      html, body {
            overscroll-behavior-y: none; /* No scrolling allowed */
        }

      body {
          min-height: 100dvh; /* Make the body at least as tall as the visible screen */
          margin: 0; 
          display: flex; 
          flex-direction: column; /* Stack the back link, nav, and main content vertically */
      }

      main {
          flex: 1; /* Make main take up all the remaining vertical space below the menu */
          display: flex;
          flex-direction: column; /* Keep the paragraphs stacked vertically */
          justify-content: center; /* Center the group of paragraphs vertically inside main */
          max-width: 42rem; /* Keep the text from becoming too wide, like on the home page */
          padding-inline: clamp(1rem, 4vw, 2.5rem); /* Responsive left and right padding */
          
          /* Move main up to 10rem to the right.
          calc(100vw - 47rem) is the available extra horizontal space:
          42rem max-width + 2.5rem left padding + 2.5rem right padding = 47rem.
          clamp keeps the margin between 0rem and 10rem, so on narrow screens
          the shift gets smaller instead of pushing the content off the right side. */
          margin-left: clamp(0rem, calc(100vw - 47rem), 10rem);
      }

      main p {
        margin-bottom: 0.5em;
    }


      .email {
          color: blue;
          font-family: var(--font-sans);
          font-size: clamp(1.5rem, 6vw, 2.5rem);
          cursor: copy;
          margin-top: 0; /* Remove the default space above the email */
      }

      /* Back to home button */
      .back {
          font-family: var(--font-sans);
          font-weight: bold;
          text-decoration: none;
          margin: 1rem 1rem 0.5rem;
      }

      /* Navigation menu */
      nav {
          font-family: var(--font-sans);
      }

      .menu {
          display: flex;
          justify-content: space-around; /* Handles the space around each button. */
          font-weight: bold;
          margin: 0.75rem 0;
      }

      .menu a {
         text-decoration: none;
      }

      /* Visited hyperlinks don't turn purple. */
      a:visited{
          color: blue;
      }
    </style>

</head>

<body>

    <!-- Menu -->
    <a class="back" href="../home">← Back to Home</a>
  
    <nav>
    <hr>
        <div class="menu">
            <span>[Contact]</span>  <!-- I use span so the flex works properly. This makes this element a container instead of just a text node. -->
            <a href="../Pablo/cv">[CV]</a>
            <a href="../Pablo/about">[About this site]</a>
            <a href="../Pablo/links">[Links]</a>
        </div>
    <hr>
    </nav>
    

    <!-- Main content: e-mail, etc. -->
    <main>
     <p>You can always contact me by e-mail at the following address:</p>

     <p class="email"><span id="email"></span></p>

     <p>
        If you are not a robot and you do not wish to destroy my brain and my inbox
        with spam, replace "[at]" by @, or just <b>click to copy it to the clipboard</b>.
     </p>
    </main>


    <!-- Notification when email is copied -->
    <div id="notification" style="
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgb(0, 0, 0, 0.5);
      color: white;
      padding: 15px;
      display: none;
    ">
      <h2>Email copied to clipboard!</h2>
    </div>

 
    <!-- Assemble email direction to obfuscate scrapers, copy email to clipboard, and show notification -->
    <script>
      (function() {
        var user = 'pablodelafuente';
        var domain = 'uvic.ca';
        var addr = user + '@' + domain;
        var element = document.getElementById('email');
        element.textContent = user + '[at]' + domain;
 
        element.parentElement.addEventListener('click', function() {
          navigator.clipboard.writeText(addr).then(() => {
            var notification = document.getElementById('notification');
            notification.style.display = 'block';
            setTimeout(() => {
              notification.style.display = 'none';
            }, 2000);
          });
        });
      })();
    </script>

</body>
</html>
